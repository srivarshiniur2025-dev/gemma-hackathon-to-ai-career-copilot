[project]
name = "ai-career-copilot-backend"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "motor>=3.6.0",
    "firebase-admin>=6.6.0",
    "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
